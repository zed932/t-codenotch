name: Codenotch
options:
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  defaultLocalization: ru

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc by default. Replace with the corporate signing identity for distribution.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targets:
  Codenotch:
    type: application
    platform: macOS
    sources:
      - path: Sources
    # The sandbox is the enforcement: without network or file entitlements the
    # OS refuses outgoing/incoming connections and access outside the container.
    # Adding any entitlement here widens what the app can do — review it as such.
    entitlements:
      path: Sources/Codenotch.entitlements
      properties:
        com.apple.security.app-sandbox: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: Codenotch
        CFBundleDisplayName: Codenotch
        CFBundleDevelopmentRegion: ru
        LSMinimumSystemVersion: "15.0"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        # Deliberately distinct from upstream so no upstream preferences are inherited.
        PRODUCT_BUNDLE_IDENTIFIER: local.corporate.codenotch
        GENERATE_INFOPLIST_FILE: "NO"
      configs:
        Release:
          # Otherwise Xcode injects get-task-allow, letting other processes attach.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: "NO"

  CodenotchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Codenotch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.corporate.codenotch.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Codenotch:
    build:
      targets:
        Codenotch: all
        CodenotchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CodenotchTests
